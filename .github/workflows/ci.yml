name: CI

# Vérifie chaque poussée sur main et chaque pull request.
#
# Pourquoi : jusqu'ici rien ne tournait automatiquement. Les régressions n'étaient
# détectées que si quelqu'un pensait à lancer les tests à la main avant de déployer —
# et une bonne partie des défauts trouvés lors de l'audit du 28/07/2026 étaient
# précisément des régressions silencieuses (page blanche du lien de réservation,
# assistant de configuration cassé, dates décalées d'un jour).
#
# Les trois niveaux sont complémentaires :
#   check    — le compilateur (rapide, attrape les contrats rompus entre fichiers)
#   test     — 127 tests unitaires (logique pure : fuseaux, factures, créneaux)
#   test:e2e — 89 vérifications sur un vrai serveur, du point de vue d'une utilisatrice

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Types (tsc)
        run: npm run check

      - name: Tests unitaires
        run: npm test

      - name: Build de production
        run: npm run build

      - name: Démarrer le serveur (SQLite éphémère)
        env:
          DB_DRIVER: sqlite
          NODE_ENV: development
          PORT: 3000
        run: |
          npm run dev > /tmp/serveur.log 2>&1 &
          # Attendre que le serveur réponde (60 s max) plutôt qu'un sleep arbitraire.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/auth/me -o /dev/null -w '%{http_code}' | grep -q 401; then
              echo "serveur prêt après ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::le serveur n'a pas démarré"; cat /tmp/serveur.log; exit 1

      - name: Tests fonctionnels bout-en-bout
        run: npm run test:e2e

      - name: Journal du serveur en cas d'échec
        if: failure()
        run: cat /tmp/serveur.log || true
